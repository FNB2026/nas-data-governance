# Read-only preview template. Load the verified fixed-version image first.
# Access through an SSH local forward to the container IP; no published ports.
services:
  ndg:
    image: ${NDG_IMAGE:?Set the verified local image ID or immutable digest}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    networks: [readonly]
    volumes:
      - type: bind
        source: ./private-config
        target: /config
        read_only: true
      - type: bind
        source: ./private-state
        target: /data
      - type: bind
        source: ${NDG_DISPOSABLE_SOURCE:?Set an explicit disposable local source}
        target: /sources/source_a
        read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    stop_grace_period: 60s
networks:
  readonly:
    internal: true
