name: 功能建议
description: 提议不削弱安全边界的新能力。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 使用抽象或合成示例，不要粘贴真实目录或资料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 安全边界影响
      description: 说明只读、符号链接、挂载点、任务根、stale、隔离、校验、审计和回滚方面的影响。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 示例均为合成内容，不含真实 NAS 路径、文件名、凭据或文件内容。
          required: true
