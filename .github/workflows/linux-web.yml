name: Linux Web boundary
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Require native runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - run: NDG_REQUIRE_MANAGED_READER_KERNEL=1 go test -race -count=1 ./internal/apihttp ./internal/app ./internal/scanner ./internal/store ./internal/managedfs ./internal/managedworker
      - name: Record rooted purge results on synthetic files
        run: |
          NDG_REQUIRE_MANAGED_READER_KERNEL=1 go test -race -count=1 -v ./internal/managedfs -run '^TestRootedPurge'
          go test -race -count=1 -v ./internal/managedworker -run '^TestQuarantinePurge(DurableWorkerFlow|PersistsAcrossDatabaseProcessKill)$'
      - name: Build and run isolated dual-purge Docker candidate
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          export NDG_QUARANTINE_IMAGE="ndg-dual-purge-integration:$source_sha"
          docker build --build-arg SOURCE_SHA="$source_sha" -f packaging/docker/Dockerfile.quarantine-candidate -t "$NDG_QUARANTINE_IMAGE" .
          mkdir -m 700 /tmp/ndg-dual-purge-integration
          export NDG_PURGE_CLI=/tmp/ndg-dual-purge-integration/ndg-private-purge
          CGO_ENABLED=0 go build -trimpath -o "$NDG_PURGE_CLI" ./cmd/ndg-private-purge
          bash scripts/qa/test-quarantine-candidate-docker.sh | tee /tmp/ndg-dual-purge-integration/synthetic-receipt.json
          docker image inspect --format '{{.Id}}' "$NDG_QUARANTINE_IMAGE" > /tmp/ndg-dual-purge-integration/image-id.txt
          git rev-parse HEAD > /tmp/ndg-dual-purge-integration/source-sha.txt
          docker save "$NDG_QUARANTINE_IMAGE" | gzip > /tmp/ndg-dual-purge-integration/dual-purge-integration-${{ matrix.architecture }}.tar.gz
          cd /tmp/ndg-dual-purge-integration
          sha256sum image-id.txt source-sha.txt synthetic-receipt.json ndg-private-purge dual-purge-integration-${{ matrix.architecture }}.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ndg-dual-purge-integration-${{ matrix.architecture }}
          path: /tmp/ndg-dual-purge-integration/
          retention-days: 14
      - name: Build private reader kernel probe without product integration
        shell: bash
        run: |
          mkdir -m 755 /tmp/ndg-managed-reader-evidence
          git diff --quiet
          git diff --cached --quiet
          git ls-files -z -- internal/managedfs internal/managedworker scripts/research/managed-reader-kernel.py scripts/research/managed-writer-kernel.py scripts/research/managed-worker-actor.py .github/workflows/linux-web.yml go.mod go.sum | xargs -0 sha256sum > /tmp/ndg-managed-reader-evidence/source-inputs.sha256
          CGO_ENABLED=0 go test -c -o /tmp/ndg-managed-reader-evidence/probe.test ./internal/managedfs
          CGO_ENABLED=0 go test -c -o /tmp/ndg-managed-reader-evidence/worker.test ./internal/managedworker
          chmod 755 /tmp/ndg-managed-reader-evidence/probe.test /tmp/ndg-managed-reader-evidence/worker.test
          git rev-parse HEAD > /tmp/ndg-managed-reader-evidence/source-sha.txt
          uname -srm > /tmp/ndg-managed-reader-evidence/kernel.txt
          go version -m /tmp/ndg-managed-reader-evidence/probe.test > /tmp/ndg-managed-reader-evidence/build-info.txt
          go version -m /tmp/ndg-managed-reader-evidence/worker.test > /tmp/ndg-managed-reader-evidence/worker-build-info.txt
          cd /tmp/ndg-managed-reader-evidence
          sha256sum probe.test worker.test > probe-before.sha256
      - name: Real same-inode mounts and cached descriptor counterexamples (not a writer or NAS test)
        shell: bash
        run: |
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 -B scripts/research/managed-reader-kernel.py /tmp/ndg-managed-reader-evidence/probe.test | tee /tmp/ndg-managed-reader-evidence/proof.json
          sha256sum -c /tmp/ndg-managed-reader-evidence/source-inputs.sha256
          cd /tmp/ndg-managed-reader-evidence
          sha256sum -c probe-before.sha256
          sha256sum probe.test probe-before.sha256 source-sha.txt source-inputs.sha256 kernel.txt build-info.txt proof.json > SHA256SUMS
      - name: Private Writer process-kill and mount counterexamples (not product or NAS acceptance)
        shell: bash
        run: |
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 -B scripts/research/managed-writer-kernel.py /tmp/ndg-managed-reader-evidence/probe.test | tee /tmp/ndg-managed-reader-evidence/writer-proof.json
          sha256sum -c /tmp/ndg-managed-reader-evidence/source-inputs.sha256
          cd /tmp/ndg-managed-reader-evidence
          sha256sum -c probe-before.sha256
          sha256sum probe.test probe-before.sha256 source-sha.txt source-inputs.sha256 kernel.txt build-info.txt proof.json writer-proof.json > SHA256SUMS
      - name: Private Worker dedicated-UID and peer authorization (not product or NAS acceptance)
        shell: bash
        run: |
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 -B scripts/research/managed-worker-actor.py /tmp/ndg-managed-reader-evidence/worker.test | tee /tmp/ndg-managed-reader-evidence/worker-actor-proof.json
          sha256sum -c /tmp/ndg-managed-reader-evidence/source-inputs.sha256
          cd /tmp/ndg-managed-reader-evidence
          sha256sum -c probe-before.sha256
          sha256sum probe.test worker.test probe-before.sha256 source-sha.txt source-inputs.sha256 kernel.txt build-info.txt worker-build-info.txt proof.json writer-proof.json worker-actor-proof.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-managed-object-proof-${{ matrix.architecture }}
          path: /tmp/ndg-managed-reader-evidence/
          if-no-files-found: error
      - run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/ndg-server-amd64 ./cmd/ndg-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/ndg-server-arm64 ./cmd/ndg-server
  disposable-container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require native runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - name: Build native container without publishing
        run: docker build --build-arg TARGETARCH="${{ matrix.architecture }}" --build-arg SOURCE_SHA="$(git rev-parse HEAD)" -f packaging/docker/Dockerfile -t ndg-disposable:test .
      - name: Synthetic read-only and restart acceptance
        run: sudo env NDG_EXPECT_ARCH="${{ matrix.architecture }}" python3 scripts/packaging/test-linux-container.py
