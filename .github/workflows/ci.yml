name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/ndg-desktop/frontend/package-lock.json

      - name: Download modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: cmd/ndg-desktop/frontend
        run: npm ci

      - name: Test and build frontend
        run: make frontend-check

      - name: Verify formatting of changed Go files
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              ;;
            *)
              base=""
              ;;
          esac

          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.go')
          else
            mapfile -d '' files < <(git ls-files -z '*.go')
          fi

          if (( ${#files[@]} == 0 )); then
            echo "No changed Go files to check."
            exit 0
          fi

          unformatted="$(printf '%s\0' "${files[@]}" | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "The following changed Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check public repository boundary
        run: make public-check

      - name: Check version consistency
        run: make version-check

      - name: Run version mapping tests
        run: ./scripts/release/test-version-mapping.sh

      - name: Run macOS release script tests
        run: ./scripts/release/test-macos-scripts.sh

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Build CLI
        run: make build
