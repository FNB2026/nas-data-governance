# golangci-lint configuration for NDG
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  go: "1.23"

linters:
  enable:
    - errcheck       # Check for unchecked errors
    - gosimple       # Simplify code
    - govet          # go vet
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Static analysis
    - typecheck      # Type-check code
    - unused         # Find unused code
    - misspell       # Find misspelled words
    - revive         # Linter from go-review
    - gofmt          # Check formatting
    - goimports      # Check import order

linters-settings:
  goimports:
    local-prefixes: github.com/FNB2026/nas-data-governance
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
        arguments: ["disableStutteringCheck"]
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: range

issues:
  exclude-rules:
    # Exclude test files from some linters
    - path: _test\.go
      linters:
        - errcheck
        - gosimple
    # Exclude generated Wails bindings
    - path: cmd/ndg-desktop/frontend/src/wailsjs
      linters:
        - all
  max-issues-per-linter: 0
  max-same-issues: 0
